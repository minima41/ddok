name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug and unsigned release APKs
        run: |
          gradle :app:assembleDebug --stacktrace
          gradle :app:assembleRelease --stacktrace

      - name: Prepare APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ddok-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk ddok-release-unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ddok-debug-apk
          path: ddok-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: ddok-release-unsigned-apk
          path: ddok-release-unsigned.apk
          if-no-files-found: error

# Release signing is intentionally kept off-repository.
# The dedicated private signing key generated for the initial signed build must be reused for updates.
